baseURL: "https://publicsite2-80183.web.app/" # IMPORTANT: Change this to your final website URL
languageCode: "en-us"
title: "Tech by J.R."
theme: "PaperMod"

params:
  # General settings
  defaultTheme: "dark" # "light" or "dark" or "auto"
  disableThemeToggle: false
  disableScrollToTop: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true

  # Home-Info Mode (Recommended for blogs)
  homeInfoParams:
    Title: "Hi there, I'm Jose Rodriguez"
    Content: "Welcome to my IT Blog! I write about different information technology capabilities that can be used from different platforms for inexpense or sometimes for no cost at all. We provide the best understandable conent for no cost while giving projects that can be shared today."

  # Social Icons (Replace with your actual links)
  #socialIcons:
  #  - name: "github"
  #    url: "https://github.com/yourusername"
  #  - name: "linkedin"
  #    url: "https://linkedin.com/in/yourusername"
  #  - name: "email"
  #    url: "mailto:your.email@example.com"

menu:
  main:
    - name: "Archive"
      url: "posts"
      weight: 1
    - name: "Tags"
      url: "tags"
      weight: 2
    - name: "Search"
      url: "search"
      weight: 3

# Enable search functionality
outputs:
  home: ["HTML", "RSS", "JSON"]